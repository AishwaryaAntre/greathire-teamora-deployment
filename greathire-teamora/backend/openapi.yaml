openapi: 3.0.3
info:
  title: GreatHire Teamora API
  version: "1.0.0"
  description: >
    Express API powering GreatHire Teamora — Auth, Employee Dashboard/Profile,
    Attendance, Leave Management, Reports & Analytics, Notifications, and Messages.
    Two roles exist: `admin` and `employee`. Most endpoints require a Bearer
    access token obtained from `/auth/login`; admin-only endpoints are marked below.
servers:
  - url: http://localhost:5000/api
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        employeeId: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [employee, admin] }
        avatar: { type: string, nullable: true }
        department: { type: string, nullable: true }
        employeeCode: { type: string, nullable: true }
    AuthTokens:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string, description: "Short-lived JWT access token" }
        refreshToken: { type: string, description: "Opaque refresh token; exchange via /auth/refresh" }
    Employee:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        department: { type: string }
        initials: { type: string }
        avatar: { type: string, nullable: true }
        email: { type: string, nullable: true }
        employeeCode: { type: string, nullable: true }
    LeaveRequest:
      type: object
      properties:
        id: { type: string }
        employeeId: { type: string }
        leaveType: { type: string, enum: [Annual, "Sick Leave", Casual, Unpaid] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [Pending, Approved, Rejected] }
    AttendanceRecord:
      type: object
      properties:
        id: { type: string }
        employeeId: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [Present, Late, Absent, Weekend] }
        checkIn: { type: string, nullable: true }
        checkOut: { type: string, nullable: true }
        hoursWorked: { type: number }

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated, but not permitted (wrong role, or not your own resource)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Request failed schema validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

tags:
  - name: Auth
  - name: Dashboard (admin-only)
  - name: Employees
  - name: Employee Dashboard (self-service)
  - name: Attendance
  - name: Leave
  - name: Reports (admin-only)
  - name: Notifications
  - name: Messages

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200": { description: API is running }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new employee-role account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/AuthTokens" } }
        "409": { description: Email already registered }
        "400": { $ref: "#/components/responses/ValidationError" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                rememberMe: { type: boolean, default: false }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/AuthTokens" } }
        "401": { description: Invalid email or password }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token (rotates the refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: New token pair issued }
        "401": { description: Invalid, expired, or already-used refresh token }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: Logged out }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset (always returns 200, never reveals whether the email exists)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200": { description: Reset instructions sent if the account exists }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password using a token from forgot-password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200": { description: Password updated }
        "400": { description: Invalid or expired reset token }

  /dashboard:
    get:
      tags: [Dashboard (admin-only)]
      summary: Convenience bundle — overview, snapshot, metrics, live workforce, activity in one call
      responses:
        "200": { description: Dashboard bundle }
        "403": { $ref: "#/components/responses/Forbidden" }

  /dashboard/live-workforce:
    get:
      tags: [Dashboard (admin-only)]
      summary: Employees currently working / on break / on leave today
      responses:
        "200": { description: Live workforce list }
        "403": { $ref: "#/components/responses/Forbidden" }

  /employees:
    get:
      tags: [Employees]
      summary: Directory list of every employee (read-only for all authenticated users)
      responses:
        "200":
          description: Employee list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Employee" }
    post:
      tags: [Employees]
      summary: Create a new employee or admin account (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [employee, admin], default: employee }
                department: { type: string }
                phone: { type: string }
      responses:
        "201": { description: "Employee (and login) created" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /employees/{id}/profile/bundle:
    get:
      tags: [Employees]
      summary: Everything EmployeeProfilePage.jsx needs for one employee, in a single call
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Profile bundle }
        "404": { $ref: "#/components/responses/NotFound" }

  /employees/{id}/profile/personal-info:
    put:
      tags: [Employees]
      summary: Update an employee's personal info (self can edit their own; admin can edit anyone's)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                avatar: { type: string, description: "Base64 data URL or image URL" }
                department: { type: string, description: "Admin-only field" }
      responses:
        "200": { description: Updated }
        "403":
          description: Attempting to edit someone else's profile without admin role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /employee/dashboard:
    get:
      tags: [Employee Dashboard (self-service)]
      summary: Everything EmployeeDashboardPage.jsx needs for the current user, in one call
      responses:
        "200": { description: Dashboard bundle }

  /employee/{id}/dashboard:
    get:
      tags: [Employee Dashboard (self-service)]
      summary: Same bundle for a specific employee — self or admin only
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Dashboard bundle }
        "403": { $ref: "#/components/responses/Forbidden" }

  /attendance:
    get:
      tags: [Attendance]
      summary: List attendance records (admins see everyone; employees see only their own)
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: department, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Paginated attendance records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AttendanceRecord" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /attendance/check-in:
    post:
      tags: [Attendance]
      summary: Check in the current user for today
      responses:
        "201": { description: Attendance record created }

  /attendance/check-out:
    post:
      tags: [Attendance]
      summary: Check out the current user for today
      responses:
        "200": { description: Attendance record updated }
        "404": { description: No check-in record found for today }

  /attendance/{id}:
    patch:
      tags: [Attendance]
      summary: Correct an attendance record (admin-only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [Present, Late, Absent, Weekend] }
                liveStatus: { type: string, enum: [Working, "On Break"], nullable: true }
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }

  /attendance/export:
    get:
      tags: [Attendance]
      summary: Export attendance as CSV (admin-only)
      responses:
        "200":
          description: CSV file
          content:
            text/csv: { schema: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leave/requests:
    get:
      tags: [Leave]
      summary: List leave requests (admins see everyone; employees see only their own)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, enum: ["This Month", "Last Month"] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/LeaveRequest" }
    post:
      tags: [Leave]
      summary: Submit a leave request for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveType, startDate, endDate]
              properties:
                leaveType: { type: string, enum: [Annual, "Sick Leave", Casual, Unpaid] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                reason: { type: string }
      responses:
        "201": { description: "Request submitted (status: Pending)" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /leave/requests/{id}/approve:
    patch:
      tags: [Leave]
      summary: Approve a leave request (admin-only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Approved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /leave/requests/{id}/reject:
    patch:
      tags: [Leave]
      summary: Reject a leave request (admin-only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Rejected }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leave/requests/approve-all:
    post:
      tags: [Leave]
      summary: Approve every pending leave request (admin-only)
      responses:
        "200": { description: All pending requests approved }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leave/export:
    get:
      tags: [Leave]
      summary: Export leave data as CSV (admin-only)
      responses:
        "200": { description: CSV file }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/generate:
    post:
      tags: [Reports (admin-only)]
      summary: Generate a new report for a range/department (admin-only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                range: { type: string }
                department: { type: string }
      responses:
        "201": { description: Report generated }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/stats:
    get:
      tags: [Reports (admin-only)]
      summary: Headline report stats (admin-only)
      responses:
        "200": { description: Stats }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the current user
      responses:
        "200": { description: Notifications }
    post:
      tags: [Notifications]
      summary: Create/broadcast a notification (admin-only)
      responses:
        "201": { description: Notification created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Marked as read }

  /messages/conversations:
    get:
      tags: [Messages]
      summary: List the current user's conversations
      responses:
        "200": { description: Conversations }

  /messages/conversations/{id}/messages:
    get:
      tags: [Messages]
      summary: List messages in a conversation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Messages }
    post:
      tags: [Messages]
      summary: Send a message in a conversation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string } }
      responses:
        "201": { description: Message sent }
